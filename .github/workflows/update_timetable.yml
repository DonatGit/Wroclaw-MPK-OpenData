name: Auto Update Timetable

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# OTO TA POPRAWKA: Wymuszamy Node.js 24 globalnie dla całego skryptu
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: Instalacja i konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Uruchomienie skryptu generującego rozkład
        run: python script.py

      - name: Automatyczny commit i push zaktualizowanych plików JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hours/
          if git diff --staged --quiet; then
            echo "Brak zmian w rozkładzie jazdy na serwerach MPK. Kończę zadanie."
          else
            git commit -m "Automatyczna aktualizacja rozkładu jazdy [Skip CI]"
            git push
          fi
